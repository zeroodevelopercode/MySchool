name: Build SekolahKu Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/.well-known/assetlinks.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sekolahku-android-debug-keystore-v1

      - name: Ensure Android debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://lqxivchzivpyvazdaxit.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gJRuzWuJjvv7PfxzZ-5AfA_3ZiMzL0f
          VITE_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure verified Android App Links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = """<intent-filter android:autoVerify="true">
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="https" android:host="myschool-umber.vercel.app" android:pathPrefix="/" />
          </intent-filter>"""
          callback = """<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="com.zeroodev.sekolahku" android:host="auth" android:pathPrefix="/callback" />
          </intent-filter>"""
          start = s.find("<activity")
          end = s.find(">", start)
          if start < 0 or end < 0:
              raise SystemExit("Main Android activity was not found")
          s = s[:end + 1] + "\n            " + marker + "\n            " + callback + s[end + 1:]
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/SekolahKu.apk
          gh release create android-build-${{ github.run_number }} release/SekolahKu.apk --title "SekolahKu Android build ${{ github.run_number }}" --notes "Build otomatis dari commit ${{ github.sha }}. APK debug untuk pengujian."

      - name: Publish signing fingerprint for App Links
        id: fingerprint
        run: |
          mkdir -p public/.well-known
          FINGERPRINT=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')
          if [ -z "$FINGERPRINT" ]; then echo "Signing fingerprint not found"; exit 1; fi
          echo "value=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          export FINGERPRINT
          python3 - <<'PY'
          import json, os
          fingerprint = os.environ["FINGERPRINT"]
          formatted = ":".join(fingerprint[i:i+2] for i in range(0, len(fingerprint), 2))
          data = [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.zeroodev.sekolahku",
              "sha256_cert_fingerprints": [formatted]
            }
          }]
          with open("public/.well-known/assetlinks.json", "w") as f:
            json.dump(data, f, indent=2)
          PY
          echo "Android App Links SHA-256: $FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit App Links verification file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android App Links signing fingerprint"
            git push
          fi
