name: Build SekolahKu Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/.well-known/assetlinks.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sekolahku-android-debug-keystore-v1

      - name: Require the existing Android signing key
        run: |
          if [ ! -s ~/.android/debug.keystore ]; then
            echo "::error::The existing Android signing key was not restored."
            echo "Refusing to generate a new key because it would make updates incompatible."
            exit 1
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Existing Android signing key is available."

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://lqxivchzivpyvazdaxit.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gJRuzWuJjvv7PfxzZ-5AfA_3ZiMzL0f
          VITE_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure verified Android App Links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = """<intent-filter android:autoVerify="true">
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="https" android:host="myschool-umber.vercel.app" android:pathPrefix="/" />
          </intent-filter>"""
          callback = """<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="com.zeroodev.sekolahku" android:host="auth" android:pathPrefix="/callback" />
          </intent-filter>"""
          start = s.find("<activity")
          end = s.find(">", start)
          if start < 0 or end < 0:
              raise SystemExit("Main Android activity was not found")
          s = s[:end + 1] + "\n            " + marker + "\n            " + callback + s[end + 1:]
          p.write_text(s)
          PY
          npx cap sync android

      - name: Install native APK updater
        run: |
          mkdir -p android/app/src/main/java/com/zeroodev/sekolahku
          cp android-native/src/main/java/com/zeroodev/sekolahku/*.java android/app/src/main/java/com/zeroodev/sekolahku/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              marker = "<application"
              s = s.replace(marker, permission + "\n    " + marker, 1)
          p.write_text(s)
          PY

      - name: Configure increasing Android version code
        run: |
          BUILD_NUMBER="${{ github.run_number }}" python3 - <<'PY'
          from pathlib import Path
          import os, re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s = s.replace("<application", permission + "\n    <application", 1)
          manifest.write_text(s)
          gradle = Path("android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()
          match = re.search(r"defaultConfig\s*\{", g)
          if not match:
              raise SystemExit("defaultConfig block not found")
          start = match.end()
          end = g.find("}", start)
          block = g[start:end]
          build = int(os.environ["BUILD_NUMBER"])
          # Build 43 is the existing 1.0 baseline. Each subsequent build
          # advances one minor version: 1.1 ... 1.9, then 2.0, etc.
          version_step = max(0, build - 43)
          version_name = f"{1 + version_step // 10}.{version_step % 10}"
          build_code = str(build)

          if re.search(r"versionCode\s+\d+", block):
              block = re.sub(r"versionCode\s+\d+", "versionCode " + build_code, block, count=1)
          elif "versionCode(" in block:
              block = re.sub(r"versionCode\(\d+\)", "versionCode(" + build_code + ")", block, count=1)
          else:
              block = "\n        versionCode " + build_code + block

          if re.search(r'versionName\s+["\'][^"\']+["\']', block):
              block = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "' + version_name + '"', block, count=1)
          elif re.search(r'versionName\(["\'][^"\']+["\']\)', block):
              block = re.sub(r'versionName\(["\'][^"\']+["\']\)', 'versionName("' + version_name + '")', block, count=1)
          else:
              block = '\n        versionName "' + version_name + '"' + block

          print(f"Android version: {version_name} (versionCode {build_code})")
          gradle.write_text(g[:start] + block + g[end:])
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK signing certificate
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -f "$APK" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::APK or apksigner was not found."
            exit 1
          fi

          KEY_FINGERPRINT="$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print tolower($2); exit}')"
          APK_FINGERPRINT="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"

          if [ -z "$KEY_FINGERPRINT" ] || [ -z "$APK_FINGERPRINT" ] || [ "$KEY_FINGERPRINT" != "$APK_FINGERPRINT" ]; then
            echo "::error::APK certificate does not match the persistent signing key."
            echo "Keystore SHA-256: $KEY_FINGERPRINT"
            echo "APK SHA-256: $APK_FINGERPRINT"
            exit 1
          fi

          echo "APK signing certificate matches the persistent keystore."
          echo "SHA-256: $APK_FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/SekolahKu.apk
          gh release create android-build-${{ github.run_number }} release/SekolahKu.apk --title "SekolahKu Android build ${{ github.run_number }}" --notes "Build otomatis dari commit ${{ github.sha }}. APK debug untuk pengujian."

      - name: Publish signing fingerprint for App Links
        id: fingerprint
        run: |
          mkdir -p public/.well-known
          FINGERPRINT=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')
          if [ -z "$FINGERPRINT" ]; then echo "Signing fingerprint not found"; exit 1; fi
          echo "value=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          export FINGERPRINT
          python3 - <<'PY'
          import json, os
          fingerprint = os.environ["FINGERPRINT"]
          formatted = ":".join(fingerprint[i:i+2] for i in range(0, len(fingerprint), 2))
          data = [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.zeroodev.sekolahku",
              "sha256_cert_fingerprints": [formatted]
            }
          }]
          with open("public/.well-known/assetlinks.json", "w") as f:
            json.dump(data, f, indent=2)
          PY
          echo "Android App Links SHA-256: $FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit App Links verification file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android App Links signing fingerprint"
            git push
          fi
